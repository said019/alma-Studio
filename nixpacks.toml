# nixpacks.toml — Configuración de build para Railway
# Vite vive en devDependencies; con NODE_ENV=production npm los salta.
# --include=dev fuerza la instalación para que `npm run build` encuentre vite.

# El estudio opera en hora civil de CDMX. En ESM los imports se evaluan antes
# que cualquier linea del entry point, asi que la garantia real es que el
# contenedor arranque ya en esta zona; la asignacion en server/index.js es la
# red de seguridad. Auditoria de zona, 2026-09-14.
[variables]
TZ = "America/Mexico_City"

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "npm ci --include=dev"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "npm start"
